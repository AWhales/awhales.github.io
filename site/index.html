<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Day of the Planet of the Night</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Silkscreen:wght@400&display=swap" rel="stylesheet">
</head>
<body class="splash-page">
  <header class="topbar">
    <nav aria-label="Site">
      <a href="index.html" aria-current="page">Home</a>
      <a href="notes.html">Notes</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="splash">
    <div class="sky" aria-hidden="true">
      <div class="cloud-layer">
        <div class="cloud-scaler">
          <div class="cloud-track">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
          </div>
        </div>
      </div>

      <div class="cloud-layer cloud-layer--offset">
        <div class="cloud-scaler">
          <div class="cloud-track">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
            <img src="assets/parralax_clouds.png" alt="" width="386" height="127" draggable="false">
          </div>
        </div>
      </div>
    </div>

    <div class="splash-props" aria-hidden="true">
      <div class="splash-prop splash-prop--house">
        <img
          class="splash-house"
          src="assets/house-6.webp"
          alt=""
          width="96"
          height="128"
          draggable="false"
        >
      </div>
      <div class="splash-prop splash-prop--bed">
        <img
          class="splash-bed"
          src="assets/bed-6.webp"
          alt=""
          width="32"
          height="48"
          draggable="false"
        >
      </div>
    </div>

    <a class="title-link" href="notes.html" aria-label="Day of the Planet of the Night — Notes">
      <span class="title-star-slot">
        <img
          class="title-star"
          src="assets/star.png"
          alt=""
          width="24"
          height="21"
          draggable="false"
        >
      </span>
      <img
        class="title"
        src="assets/title.png"
        alt=""
        width="149"
        height="21"
        draggable="false"
      >
      <img
        class="title-sub"
        src="assets/subtitle.png"
        alt=""
        width="95"
        height="4"
        draggable="false"
      >
    </a>
  </main>
  <script src="js/cloud-drag.js" defer></script>
</body>
</html>
